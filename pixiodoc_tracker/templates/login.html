<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceder - PIXO Therapy</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pixo.css') }}">
</head>
<body data-theme="light">

<div class="auth-screen">
    <div class="auth-bg-carousel">
        <div class="auth-bg-slide active" style="background-image:url('https://static.vecteezy.com/system/resources/previews/003/115/254/large_2x/doctor-holding-touching-hands-asian-senior-woman-patient-with-love-free-photo.jpg')"></div>
        <div class="auth-bg-slide" style="background-image:url('https://www.homeopatiasuma.com/wp-content/uploads/2020/02/manos-medico-paciente.jpg')"></div>
        <div class="auth-bg-slide" style="background-image:url('https://plus.unsplash.com/premium_photo-1675808577162-b88b009b6ea6?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D')"></div>
    </div>
    <div class="auth-card">
        <div class="auth-brand">
            <span class="mark"><svg class="ic"><use href="#i-hand"/></svg></span>
            <h1>PIXO Therapy</h1>
            <p>Plataforma de juegos terapéuticos</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="ui {{ 'negative' if category in ('danger', 'error') else 'positive' if category == 'success' else '' }} message">
            <p>{{ message }}</p>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="ui divider"></div>

        <form class="ui form" method="POST">
            <div class="required field">
                <label>Email</label>
                <input type="email" name="email" placeholder="Ingrese su correo electrónico" required>
            </div>
            <div class="required field">
                <label>Contraseña</label>
                <input type="password" name="password" placeholder="Ingrese su contraseña" required>
            </div>
            <button type="submit" class="ui fluid primary button" style="margin-top:8px;">Acceder</button>
            <a href="https://www.canva.com/design/DAHLj1_u60o/d5kzVq2sWptKHkgHo1sxog/view?utm_content=DAHLj1_u60o&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=hc0cf6ed273"
               target="_blank" rel="noopener noreferrer"
               class="ui fluid basic button" style="margin-top:6px;">
                <svg class="ic"><use href="#i-expand"/></svg> Más información
            </a>
        </form>

        <div class="ui divider"></div>
        <p style="text-align:center;margin:0;color:var(--muted);">¿Eres paciente y no tienes cuenta?
            <a href="{{ url_for('auth.register') }}" style="font-weight:700;">Regístrate</a></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.js"></script>
<script src="{{ url_for('static', filename='js/pixo-ui.js') }}"></script>
<script>(function(){var s=document.querySelectorAll('.auth-bg-slide'),i=0;setInterval(function(){s[i].classList.remove('active');i=(i+1)%s.length;s[i].classList.add('active');},7000);})();</script>
</body>
</html>
