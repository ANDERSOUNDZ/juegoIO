<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PIXO Therapy</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✋</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.25.16/dist/css/uikit.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/platform.css') }}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        @media (max-width: 480px) {
            .auth-container { padding: 16px; }
            .auth-card { padding: 20px; }
            .auth-card h1 { font-size: clamp(14px, 5vw, 20px); }
            .brand-mark { width: 40px; height: 40px; }
        }
        @media (max-width: 360px) {
            .auth-card { padding: 14px; border-radius: 16px; }
            .auth-card h1 { font-size: 16px; }
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at top left, rgba(37,99,235,.16), transparent 30rem),
                radial-gradient(circle at bottom right, rgba(20,184,166,.16), transparent 28rem),
                linear-gradient(180deg, #f8fbff 0%, #eef3f9 100%);
            color: var(--pixo-ink);
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .auth-container {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 28px;
        }
        .auth-card {
            width: min(440px, 100%);
            padding: 34px;
            background: rgba(255,255,255,.94);
            border: 1px solid rgba(226,232,240,.95);
            border-radius: 24px;
            box-shadow: 0 26px 70px rgba(15,23,42,.11);
        }
        .brand-mark {
            width: 54px;
            height: 54px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            color: #ffffff;
            background: linear-gradient(135deg, var(--pixo-primary), var(--pixo-accent));
            box-shadow: 0 16px 34px rgba(37,99,235,.23);
            margin-bottom: 18px;
        }
        .auth-card h1 {
            margin: 0;
            color: var(--pixo-ink);
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -.04em;
        }
        .auth-card p {
            margin: 8px 0 24px;
            color: var(--pixo-muted);
        }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: 800;
            font-size: .86rem;
        }
        .form-control,
        .uk-input {
            width: 100%;
            min-height: 46px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            background: #ffffff;
            color: var(--pixo-ink);
            padding: 10px 12px;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .form-control:focus,
        .uk-input:focus {
            outline: none;
            border-color: var(--pixo-primary);
            box-shadow: 0 0 0 4px rgba(37,99,235,.12);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-height: 46px;
            border: 0;
            border-radius: 12px;
            background: #ffffff;
            color: #334155;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: .95rem;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            transition: all .14s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--pixo-primary), #4f46e5);
            color: #ffffff;
            box-shadow: 0 14px 28px rgba(37,99,235,.22);
        }
        .btn:hover { transform: translateY(-1px); }
        .auth-link {
            margin-top: 22px;
            text-align: center;
            color: var(--pixo-muted);
        }
        .auth-link a {
            color: var(--pixo-primary);
            font-weight: 800;
            text-decoration: none;
        }
        .flash {
            border: 1px solid var(--pixo-border);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 14px;
            background: #ffffff;
            color: var(--pixo-ink);
            font-weight: 700;
        }
        .flash-danger, .flash-error { border-color: rgba(220,38,38,.32); background: #fff5f5; color: var(--pixo-danger); }
        .flash-success { border-color: rgba(20,184,166,.32); background: #f0fdfa; color: #0f766e; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card uk-card uk-card-default uk-card-body">
            <div class="brand-mark" uk-icon="icon: play-circle; ratio: 1.35"></div>
            <h1>PIXO Therapy</h1>
            <p>Plataforma profesional de juegos terapeuticos.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" class="uk-form-stacked">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control uk-input" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control uk-input" required>
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>

            <div class="auth-link">
                <a href="{{ url_for('auth.register') }}">Crear cuenta</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.25.16/dist/js/uikit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.25.16/dist/js/uikit-icons.min.js"></script>
</body>
</html>
