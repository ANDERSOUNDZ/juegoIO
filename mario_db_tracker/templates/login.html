<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceder - PIXO Therapy</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✋</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pixo.css') }}">
</head>
<body data-theme="light">

<div class="auth-screen">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="mark"><svg class="ic"><use href="#i-hand"/></svg></span>
            <h1>PIXO Therapy</h1>
            <p>Plataforma de juegos terapéuticos</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="ui {{ 'negative' if category in ('danger', 'error') else 'positive' if category == 'success' else '' }} message">
            <p>{{ message }}</p>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="ui divider"></div>

        <form class="ui form" method="POST">
            <div class="required field">
                <label>Email</label>
                <input type="email" name="email" placeholder="correo@clinica.com" required>
            </div>
            <div class="required field">
                <label>Contraseña</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="ui fluid primary button" style="margin-top:8px;">Acceder</button>
        </form>

        <div class="ui divider"></div>
        <p style="text-align:center;margin:0;color:var(--muted);">¿No tienes cuenta?
            <a href="{{ url_for('auth.register') }}" style="font-weight:700;">Crear cuenta</a></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.js"></script>
<script src="{{ url_for('static', filename='js/pixo-ui.js') }}"></script>
</body>
</html>
