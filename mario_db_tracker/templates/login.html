<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PIXO Therapy</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✋</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.css">
    <style>
        body { margin: 0; background: #f0f2f5; }
        .brand-mark {
            width: 54px;
            height: 54px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            color: #fff;
            background: linear-gradient(135deg, #2563eb, #14b8a6);
            font-size: 24px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div style="display:flex; justify-content:center; align-items:center; height:100vh;">
        <div class="ui card" style="width:420px; max-width:90vw; padding:30px;">
            <div style="text-align:center;">
                <div class="brand-mark">✋</div>
                <h1 class="ui header" style="margin:0 0 4px;">PIXO Therapy</h1>
                <p style="color:#888; margin-bottom:20px;">Plataforma de juegos terapeuticos</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="ui {{ 'negative' if category in ('danger', 'error') else 'positive' if category == 'success' else '' }} message">
                <p>{{ message }}</p>
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <div class="ui divider"></div>

            <form class="ui form" method="POST">
                <div class="required field">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Email" required>
                </div>
                <div class="required field">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <br>
                <button type="submit" class="ui fluid teal button">Acceder</button>
            </form>

            <div class="ui divider"></div>
            <p style="text-align:center; margin:0;">No tienes cuenta? <a href="{{ url_for('auth.register') }}" style="text-decoration:underline;">Crear cuenta</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.js"></script>
</body>
</html>
